<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Trying to Complete the Rainbow</title>
 
  <script>
    // Classify phones before any artwork or AI initialization. Tablets and
    // narrow desktop windows keep the existing artwork experience.
    window.rainbowPhone = navigator.userAgentData?.mobile === true ||
      /iPhone|iPod|Android.*Mobile|Windows Phone|BlackBerry|BB10|Opera Mini|IEMobile/i.test(navigator.userAgent);
    if (window.rainbowPhone) document.documentElement.classList.add("is-phone");
  </script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #020202;
      --fg: #f1f1f1;
      --muted: #8a8a8a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    #phoneFallback { display: none; }

    .is-phone body { background: #000; }
    .is-phone #app, .is-phone #workCanvas { display: none; }
    .is-phone #phoneFallback {
      position: fixed;
      inset: 0;
      height: var(--phone-height, 100%);
      display: grid;
      place-items: center;
      overflow: auto;
      padding: calc(24px + env(safe-area-inset-top, 0px))
        calc(24px + env(safe-area-inset-right, 0px))
        calc(24px + env(safe-area-inset-bottom, 0px))
        calc(24px + env(safe-area-inset-left, 0px));
      background: #000;
      color: #fff;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }
    #phoneFallback h1 {
      margin: 0 0 20px;
      font: inherit;
      font-weight: 600;
    }
    #phoneFallback p { margin: 0; }
    #phoneFallback p + p { margin-top: 16px; }

    #app {
      --viewport-height: 100vh;
      position: relative;
      width: 100%;
      height: var(--viewport-height);
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      background: var(--bg);
    }

    @supports (height: 100svh) {
      #app { --viewport-height: 100svh; }
    }

    @supports (height: 100dvh) {
      #app { --viewport-height: 100dvh; }
    }

    #stage {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 22px 22px 0;
    }

    #circleCanvas {
      display: block;
      width: var(--canvas-size, 0px);
      height: var(--canvas-size, 0px);
    }

    #minimalUi {
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-end;
      align-items: center;
      column-gap: 12px;
      row-gap: 4px;
      min-width: 0;
      min-height: 54px;
      padding: 8px 18px 16px;
      font-size: 11px;
      line-height: 1.3;
    }

    #status {
      color: var(--muted);
      overflow-wrap: anywhere;
      max-width: 100%;
    }

    #saveImageBtn,
    #newRainbowBtn {
      display: none;
      appearance: none;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--fg);
      font: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      touch-action: manipulation;
    }

    #saveImageBtn.is-visible,
    #newRainbowBtn.is-visible {
      display: inline-block;
    }

    @media (pointer: coarse) {
      #saveImageBtn, #newRainbowBtn { min-height: 44px; }
    }

    #workCanvas {
      display: none;
    }

    @media (max-width: 650px), (max-height: 500px) {
      #stage { padding: 10px 10px 0; }
      #minimalUi {
        min-height: 52px;
        padding: 6px 12px 12px;
      }
    }
  </style>
</head>

<body>
<section id="phoneFallback" aria-labelledby="phoneTitle">
  <div>
    <h1 id="phoneTitle">Trying to Complete the Rainbow</h1>
    <p>This artwork requires a desktop browser.</p>
    <p>Please visit this page on a computer to experience the work.</p>
  </div>
</section>
<main id="app">

  <section id="stage">
    <canvas id="circleCanvas"></canvas>
  </section>

  <div id="minimalUi">
    <span id="status" role="status" aria-live="polite">loading rainbow detector…</span>
    <button id="saveImageBtn" type="button">save image</button>
    <button id="newRainbowBtn" type="button">new rainbow</button>
  </div>

</main>

<canvas id="workCanvas"></canvas>

<script>
// Layout and initial status do not depend on the CDN, worker or AI runtime.
(() => {
  if (window.rainbowPhone) {
    function fitPhoneViewport() {
      const viewport = window.visualViewport;
      const height = viewport && viewport.scale === 1
        ? Math.min(window.innerHeight, viewport.height) : window.innerHeight;
      document.documentElement.style.setProperty("--phone-height", height + "px");
    }
    window.addEventListener("resize", fitPhoneViewport);
    window.visualViewport?.addEventListener("resize", fitPhoneViewport);
    fitPhoneViewport();
    return;
  }
  const app = document.getElementById("app");
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("circleCanvas");
  const status = document.getElementById("status");
  function fitViewport() {
    const viewport = window.visualViewport;
    const height = viewport && viewport.scale === 1
      ? Math.min(window.innerHeight, viewport.height) : window.innerHeight;
    app.style.setProperty("--viewport-height", height + "px");
    fitCanvas();
  }
  function fitCanvas() {
    const style = getComputedStyle(stage);
    const width = stage.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    const height = stage.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    canvas.style.setProperty("--canvas-size", Math.max(0, Math.floor(Math.min(width, height))) + "px");
  }
  window.addEventListener("resize", fitViewport);
  window.visualViewport?.addEventListener("resize", fitViewport);
  if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(stage);
  fitViewport();
  window.addEventListener("error", event => {
    // Resource failures and worker fallback errors are handled by the artwork.
    if (event.target === window) status.textContent = "artwork error: " + (event.message || "could not start");
  });
  window.addEventListener("unhandledrejection", event => {
    status.textContent = "artwork error: " + (event.reason?.message || String(event.reason));
  });
})();
</script>

<script type="module">
let pipeline, RawImage, env;

(() => {
  "use strict";

  // Exit before canvas setup, library import, workers, or model requests.
  if (window.rainbowPhone) return;

  /*
  ============================================================
  TRYING TO COMPLETE THE RAINBOW — LARGE FIELD + SAFE EDGES
  ZERO-SHOT RAINBOW DETECTION / SESSION CONTINUATION
  ============================================================

  The model is ONLY used to answer:

      "Where is the rainbow in this photograph?"

  Everything else remains generative / rule based.

  Wikimedia image
      ↓
  OWL-ViT zero-shot object detection
      ↓
  bounding box for "rainbow"
      ↓
  crop real photographed rainbow
      ↓
  rotate / flip / scale / overlap
      ↓
  try to complete one circle

  Nothing is artificially bent into an arc.
  ============================================================
  */

  const API =
    "https://commons.wikimedia.org/w/api.php";

  /*
  Prefer categories where the rainbow itself is likely to be
  clearly visible.

  We deliberately exclude Category:Circular rainbows.
  */
  const CATEGORIES = [
    "Category:Quality images of rainbows",
    "Category:Semi-circular rainbows",
    "Category:Double rainbows",
    "Category:Rainbows"
  ];

  const THUMB_WIDTH = 900;

  /*
  Zero-shot detection model.

  OWL-ViT is open-vocabulary:
  it can search for a text concept such as "rainbow".
  */
  const MODEL =
    "Xenova/owlvit-base-patch32";

  /*
  We use several text descriptions.

  The score can be quite low even when the object is correct,
  so this threshold is intentionally permissive.
  */
  const LABELS = [
    "rainbow",
    "a rainbow in the sky",
    "double rainbow",
    "rainbow arc"
  ];

  const MODEL_THRESHOLD = 0.045;

  /*
  A second score threshold after filtering results.
  */
  const ACCEPT_SCORE = 0.055;

  // Smaller inputs are opt-in: ?rainbowInput=768 (default: original 900px thumb).
  // OWL-ViT resizes internally; this reduces preprocessing, not model compute.
  const inputLimit = Number(new URLSearchParams(location.search).get("rainbowInput"));
  const INPUT_MAX_EDGE = [640, 768].includes(inputLimit) ? inputLimit : Infinity;
  const backendPreference = new URLSearchParams(location.search).get("rainbowBackend");
  let runtime = null;
  const API_INTERVAL_MS = 1000;
  let nextApiAt = 0;
  let apiFailures = 0;
  let inferenceTail = Promise.resolve();
  const prefetched = new Map();
  const metrics = {
    images: 0, imageErrors: 0, imageLoadMs: 0, imageWaitMs: 0,
    inferences: 0, inferenceErrors: 0, inferenceMs: 0, preparationMs: 0,
    modelMs: 0, preprocessMs: 0, tokenizationMs: 0, postprocessMs: 0,
    imageDecodeMs: 0, placementMs: 0, cropMs: 0, backendFallbacks: 0,
    lastInference: null, firstInference: null,
    accepted: 0, acceptanceIntervals: 0, acceptanceIntervalMs: 0,
    lastAcceptedAt: null, modelLoadMs: 0, apiRequests: 0
  };
  // Session totals intentionally survive "new rainbow". No polling or visible UI.
  window.rainbowDiagnostics = () => ({
    ...metrics,
    runtime,
    browser: navigator.userAgent,
    secureContext: isSecureContext,
    webgpuExposed: Boolean(navigator.gpu),
    inputMaxEdge: Number.isFinite(INPUT_MAX_EDGE) ? INPUT_MAX_EDGE : "original",
    averageImageLoadMs: metrics.imageLoadMs / (metrics.images || 1),
    averageImageLoadExcludingDecodeMs: (metrics.imageLoadMs - metrics.imageDecodeMs) / (metrics.images || 1),
    averageImageWaitMs: metrics.imageWaitMs / (metrics.images || 1),
    averagePreparationMs: metrics.preparationMs / (metrics.inferences || 1),
    // inferenceMs retains its original meaning: whole pipeline + worker round trip.
    averageInferenceMs: metrics.inferenceMs / (metrics.inferences || 1),
    averageModelMs: metrics.modelMs / (metrics.inferences || 1),
    averagePreprocessMs: metrics.preprocessMs / (metrics.inferences || 1),
    averageDecodeMs: metrics.imageDecodeMs / (metrics.images || 1),
    averagePlacementMs: metrics.placementMs / (metrics.accepted || 1),
    averageCropMs: metrics.cropMs / (metrics.accepted || 1),
    acceptanceRate: metrics.accepted / (metrics.inferences || 1),
    averageAcceptedIntervalMs: metrics.acceptanceIntervals
      ? metrics.acceptanceIntervalMs / metrics.acceptanceIntervals : null,
    currentFragments: state.fragments.length,
    coveredSectors: state.coveredSectors.filter(Boolean).length,
    complete: state.complete
  });

  function prepareImage(item) {
    if (!prefetched.has(item.thumburl)) {
      const started = performance.now();
      // Resolve errors as values so speculative loading cannot reject unhandled.
      const promise = loadImage(item.thumburl).then(img => {
        metrics.images += 1;
        metrics.imageLoadMs += performance.now() - started;
        return { img };
      }, error => {
        metrics.imageErrors += 1;
        return { error };
      });
      prefetched.set(item.thumburl, promise);
    }
    return prefetched.get(item.thumburl);
  }

  function prefetchNext() {
    if (!state.complete && searchSession.queue[0]) {
      prepareImage(searchSession.queue[0]);
    }
  }

  async function inferSerial(input, token) {
    const previous = inferenceTail;
    let release;
    inferenceTail = new Promise(resolve => { release = resolve; });
    await previous;
    try {
      if (token !== runToken || state.paused) return null;
      const started = performance.now();
      metrics.inferences += 1;
      try {
        let result;
        try {
          result = await detector(input, LABELS, { threshold: MODEL_THRESHOLD, top_k: 8 });
        } catch (error) {
          if (runtime?.device !== "webgpu") throw error;
          // Dispose before creating a fresh CPU runtime, then retry this same
          // photograph inside the serial lock. Its pixels remain available.
          console.warn("GPU inference failed; switching to WASM:", error);
          detector.dispose?.();
          if (token !== runToken || state.paused || state.complete) return null;
          metrics.backendFallbacks += 1;
          detector = await createBrowserDetector("wasm");
          if (token !== runToken || state.paused) return null;
          result = await detector(input, LABELS, { threshold: MODEL_THRESHOLD, top_k: 8 });
        }
        if (result.timings) {
          metrics.lastInference = result.timings;
          metrics.firstInference ??= result.timings;
          for (const key of ["modelMs", "preprocessMs", "tokenizationMs", "postprocessMs"])
            metrics[key] += result.timings[key];
        }
        // Stub detectors used by regression checks may return an array directly.
        return result.detections || result;
      } catch (error) {
        metrics.inferenceErrors += 1;
        throw error;
      } finally {
        metrics.inferenceMs += performance.now() - started;
      }
    } finally {
      release();
    }
  }

  /*
  How much original photograph remains around model box.
  */
  const BOX_PADDING_X = 0.18;
  const BOX_PADDING_Y = 0.28;

  const canvas =
    document.getElementById("circleCanvas");

  const ctx =
    canvas.getContext("2d");

  const workCanvas =
    document.getElementById("workCanvas");

  const workCtx =
    workCanvas.getContext(
      "2d",
      { willReadFrequently: true }
    );

  const statusEl =
    document.getElementById("status");

  const saveImageBtn =
    document.getElementById("saveImageBtn");

  const newRainbowBtn =
    document.getElementById("newRainbowBtn");

  let detector = null;
  let state = freshCircleState();
  let runToken = 0;

  /*
  SESSION SEARCH STATE

  This survives RESET, but disappears naturally if the page
  is reloaded.

  reset  = new circle, continue deeper into Commons
  reload = new session, start from the beginning

  No localStorage and no backend.
  */
  const searchSession = {
    queue: [],
    seenTitles: new Set(),
    categoryIndex: 0,
    categoryStates:
      CATEGORIES.map(() => ({
        continueToken: null,
        exhausted: false
      }))
  };

  function freshCircleState() {
    return {
      searched: 0,
      accepted: 0,
      coveredSectors: new Array(72).fill(false),
      complete: false,
      fragments: [],
      paused: false,
      sourceTitles: new Set(),
      sourceHashes: new Set()
    };
  }

  /*
  ============================================================
  MODEL
  ============================================================
  */

  async function createBrowserDetector(forcedDevice) {
    let device = forcedDevice || "wasm";
    if (!forcedDevice && backendPreference !== "wasm" && navigator.gpu) {
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (adapter && !adapter.info?.isFallbackAdapter) device = "webgpu";
      } catch { /* Browsers can expose WebGPU without providing an adapter. */ }
    }
    const options = { model: MODEL, labels: LABELS, device,
      dtype: device === "webgpu" ? "fp32" : "q8" };
    let worker;
    let disposeWorker = () => worker?.terminate();
    try {
      // Model computation lives in a worker; the collage stays responsive.
      worker = new Worker(new URL("./detector-worker.js", import.meta.url), { type: "module" });
      const pending = new Map();
      let sequence = 0;
      let workerError;
      const fail = error => {
        workerError = error;
        for (const { reject, timer } of pending.values()) { clearTimeout(timer); reject(error); }
        pending.clear();
      };
      disposeWorker = () => {
        worker.terminate();
        fail(new Error("Detector disposed"));
      };
      worker.onerror = event => fail(new Error(event.message || "Detector worker failed"));
      worker.onmessageerror = () => fail(new Error("Detector message could not be decoded"));
      worker.onmessage = ({ data }) => {
        if (data.fatal) { fail(new Error(data.fatal)); return; }
        const request = pending.get(data.id);
        if (!request) return;
        clearTimeout(request.timer);
        pending.delete(data.id);
        if (data.error) request.reject(new Error(data.error));
        else request.resolve(data.result);
      };
      const request = (type, payload) => new Promise((resolve, reject) => {
        if (workerError) { reject(workerError); return; }
        const id = ++sequence;
        const timer = setTimeout(() => {
          pending.delete(id);
          reject(new Error("Detector " + type + " timed out"));
        }, type === "init" ? 180000 : 60000);
        pending.set(id, { resolve, reject, timer });
        // Preserve input pixels for a serial CPU retry if the GPU fails.
        try { worker.postMessage({ id, type, ...payload }); }
        catch (error) { clearTimeout(timer); pending.delete(id); reject(error); }
      });
      runtime = await request("init", { options });
      const infer = input => request("infer", {
        image: { data: input.data, width: input.width, height: input.height }
      });
      infer.dispose = disposeWorker;
      return infer;
    } catch (error) {
      disposeWorker();
      if (device === "webgpu") {
        metrics.backendFallbacks += 1;
        console.warn("GPU initialization failed; trying a fresh WASM worker:", error);
        return createBrowserDetector("wasm");
      }
      // Worker-restricted hosts/file URLs still retain a working CPU path.
      env.backends.onnx.wasm.numThreads = crossOriginIsolated
        ? Math.max(1, Math.min(4, Math.floor((navigator.hardwareConcurrency || 2) / 2))) : 1;
      const cpu = await withTimeout(
        pipeline("zero-shot-object-detection", MODEL, { device: "wasm", dtype: "q8" }),
        180000, "CPU detector loading timed out — reload to retry",
        lateDetector => lateDetector.dispose()
      );
      runtime = { device: "wasm", dtype: "q8", worker: false,
        isolated: crossOriginIsolated, wasmThreads: env.backends.onnx.wasm.numThreads };
      // Instrument the pipeline without changing its tensor/preprocessing behavior.
      let stages;
      for (const [key, name] of [["processor", "preprocessMs"], ["model", "modelMs"]]) {
        const original = cpu[key];
        cpu[key] = new Proxy(original, { apply: async (target, receiver, args) => {
          const started = performance.now();
          try { return await Reflect.apply(target, receiver, args); }
          finally { stages[name] += performance.now() - started; }
        }});
      }
      const originalTokenizer = cpu.tokenizer;
      cpu.tokenizer = new Proxy(originalTokenizer, { apply(target, receiver, args) {
        const started = performance.now();
        try { return Reflect.apply(target, receiver, args); }
        finally { stages.tokenizationMs += performance.now() - started; }
      }});
      const infer = async input => {
        stages = { preprocessMs: 0, modelMs: 0, tokenizationMs: 0, postprocessMs: 0 };
        const started = performance.now();
        const detections = await cpu(input, LABELS, { threshold: MODEL_THRESHOLD, top_k: 8 });
        const pipelineMs = performance.now() - started;
        stages.postprocessMs = Math.max(0, pipelineMs - stages.modelMs - stages.preprocessMs - stages.tokenizationMs);
        return { detections, timings: { ...stages, pipelineMs } };
      };
      infer.dispose = () => cpu.dispose();
      return infer;
    }
  }

  async function loadDetector() {
    try {
      setStatus(
        "loading…",
        true
      );

      const started = performance.now();
      ({ pipeline, RawImage, env } = await withTimeout(
        import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm"),
        45000, "detector library download timed out — check your connection and reload"
      ));
      env.allowLocalModels = false;
      detector = await createBrowserDetector();
      metrics.modelLoadMs = performance.now() - started;

      setStatus(
        "searching for rainbows…",
        false
      );

      saveImageBtn.classList.remove(
        "is-visible"
      );

      newRainbowBtn.classList.remove(
        "is-visible"
      );

      run().catch(err => setStatus("artwork error: " + (err.message || String(err)), false));
    }
    catch (err) {
      console.error(
        "Could not load detector:",
        err
      );

      setStatus(
        "detector unavailable: " + (err.message || String(err)),
        false
      );
    }
  }

  /*
  ============================================================
  DISPLAY
  ============================================================
  */

  function resizeCanvas() {
    const rect =
      canvas.getBoundingClientRect();

    const dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );

    const px =
      Math.max(
        320,
        Math.round(
          rect.width * dpr
        )
      );

    if (
      canvas.width !== px ||
      canvas.height !== px
    ) {
      canvas.width = px;
      canvas.height = px;

      recomputeCoverage();
      drawAll();
    }
  }

  function drawAll() {
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(
      0,
      0,
      w,
      h
    );

    const cx = w / 2;
    const cy = h / 2;

    /*
    Invisible target circle.
    */
    const targetR =
      Math.min(w, h) * 0.27;

    for (
      const fragment
      of state.fragments
    ) {
      drawFragment(
        fragment,
        cx,
        cy,
        targetR
      );
    }
  }

  /*
  ============================================================
  SAFE PLACEMENT
  ============================================================

  Large images are still allowed.

  We do NOT scale them down to fit.
  Instead, if a rotated image would extend beyond the canvas,
  its centre is moved slightly inward toward the centre.

  This preserves the size variation while avoiding hard crops
  at the canvas edge.
  ============================================================
  */

  function getSafeFragmentPosition(
    fragment,
    cx,
    cy,
    targetR,
    canvasW,
    canvasH
  ) {
    const img =
      fragment.canvas;

    const angle =
      fragment.angle;

    const aspect =
      img.width /
      Math.max(
        img.height,
        1
      );

    const drawH =
      targetR *
      fragment.scale;

    const drawW =
      drawH *
      aspect *
      fragment.widthScale;

    const rotation =
      angle +
      Math.PI / 2 +
      fragment.rotationError;

    /*
    Axis-aligned bounding box of the rotated rectangle.
    */
    const cos =
      Math.abs(
        Math.cos(
          rotation
        )
      );

    const sin =
      Math.abs(
        Math.sin(
          rotation
        )
      );

    const boundW =
      drawW * cos +
      drawH * sin;

    const boundH =
      drawW * sin +
      drawH * cos;

    /*
    Initial position.
    */
    let radius =
      targetR * (1 + fragment.radialOffset);

    /*
    Keep a small black margin around the composition.
    */
    const margin =
      Math.max(
        0,
        Math.min(
          canvasW,
          canvasH
        ) * 0.025
      );

    /*
    Move the fragment inward iteratively until its rotated
    bounding box fits, or until it reaches the centre.
    */
    for (
      let attempt = 0;
      attempt < 24;
      attempt += 1
    ) {
      const x =
        cx +
        Math.cos(angle) *
        radius;

      const y =
        cy +
        Math.sin(angle) *
        radius;

      const left =
        x -
        boundW / 2;

      const right =
        x +
        boundW / 2;

      const top =
        y -
        boundH / 2;

      const bottom =
        y +
        boundH / 2;

      const fits =
        left >= margin &&
        right <=
          canvasW - margin &&
        top >= margin &&
        bottom <=
          canvasH - margin;

      if (fits) {
        return {
          x,
          y,
          drawW,
          drawH
        };
      }

      /*
      Only move inward.
      Image size stays unchanged.
      */
      radius *= 0.94;
    }

    /*
    Final fallback: draw as far inward as we got.
    */
    return {
      x:
        cx +
        Math.cos(angle) *
        radius,

      y:
        cy +
        Math.sin(angle) *
        radius,

      drawW,
      drawH
    };
  }

  function drawFragment(
    fragment,
    cx,
    cy,
    targetR
  ) {
    const img =
      fragment.canvas;

    const angle =
      fragment.angle;

    const placement =
      getSafeFragmentPosition(
        fragment,
        cx,
        cy,
        targetR,
        canvas.width,
        canvas.height
      );

    const x =
      placement.x;

    const y =
      placement.y;

    const drawW =
      placement.drawW;

    const drawH =
      placement.drawH;

    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.rotate(
      angle +
      Math.PI / 2 +
      fragment.rotationError
    );

    ctx.scale(
      fragment.flipX
        ? -1
        : 1,

      fragment.flipY
        ? -1
        : 1
    );

    ctx.globalAlpha =
      fragment.alpha;

    ctx.drawImage(
      img,

      -drawW / 2,
      -drawH / 2,

      drawW,
      drawH
    );

    ctx.restore();
  }

  /*
  ============================================================
  WIKIMEDIA COMMONS
  ============================================================
  */

  async function refillQueue() {
    if (state.complete) {
      return;
    }

    setStatus(
      "searching for rainbows…",
      true
    );

    let attempts = 0;
    let categoryIndex = -1;

    while (
      attempts < CATEGORIES.length
    ) {
      const index =
        searchSession.categoryIndex %
        CATEGORIES.length;

      searchSession.categoryIndex =
        (
          searchSession.categoryIndex + 1
        ) %
        CATEGORIES.length;

      attempts += 1;

      if (
        !searchSession
          .categoryStates[index]
          .exhausted
      ) {
        categoryIndex = index;
        break;
      }
    }

    if (categoryIndex === -1) {
      setStatus(
        "Commons search exhausted for this session",
        false
      );
      return;
    }

    const category =
      CATEGORIES[categoryIndex];

    const categoryState =
      searchSession
        .categoryStates[categoryIndex];

    const params =
      new URLSearchParams({
        origin: "*",
        action: "query",
        format: "json",
        formatversion: "2",
        generator: "categorymembers",
        gcmtitle: category,
        gcmtype: "file",
        gcmlimit: "50",
        prop: "imageinfo",
        iiprop: "url|mime|size|sha1",
        iiurlwidth:
          String(
            THUMB_WIDTH
          )
      });

    if (
      categoryState.continueToken
    ) {
      params.set(
        "gcmcontinue",
        categoryState.continueToken
      );
    }

    try {
      await sleep(Math.max(0, nextApiAt - performance.now()));
      if (state.complete) return;
      nextApiAt = performance.now() + API_INTERVAL_MS;
      metrics.apiRequests += 1;
      const response =
        await fetch(
          `${API}?${params.toString()}`
        );

      if (!response.ok) {
        const retryAfter = response.headers.get("Retry-After");
        const retryMs = /^\d+$/.test(retryAfter || "")
          ? Number(retryAfter) * 1000 : Date.parse(retryAfter) - Date.now();
        if (Number.isFinite(retryMs)) nextApiAt = Math.max(nextApiAt, performance.now() + retryMs);
        throw new Error(
          `HTTP ${response.status}`
        );
      }

      const data =
        await response.json();

      if (data.error) throw new Error(data.error.info || data.error.code);
      apiFailures = 0;
      const pages =
        data?.query?.pages ||
        [];

      const nextToken =
        data?.continue?.gcmcontinue ||
        null;

      categoryState.continueToken =
        nextToken;

      if (!nextToken) {
        categoryState.exhausted =
          true;
      }

      const candidates =
        pages
          .map(
            page => {
              const info =
                page.imageinfo?.[0];

              return {
                title:
                  page.title,

                sha1: info?.sha1,

                thumburl:
                  info?.thumburl ||
                  info?.url,

                descriptionurl:
                  info?.descriptionurl,

                mime:
                  info?.mime || ""
              };
            }
          )
          .filter(
            item =>
              item.thumburl
          )
          .filter(
            item =>
              /^image\/(jpeg|png|webp)$/i
                .test(
                  item.mime
                )
          )
          .filter(
            item =>
              !/circular rainbow/i
                .test(
                  item.title
                )
          );

      for (
        const item
        of candidates
      ) {
        if (
          !searchSession.seenTitles
            .has(
              item.title
            )
        ) {
          searchSession.seenTitles
            .add(
              item.title
            );

          searchSession.queue
            .push(
              item
            );
        }
      }

      if (
        searchSession.queue.length === 0 &&
        !allCategoriesExhausted()
      ) {
        await refillQueue();
      }
    }
    catch (err) {
      apiFailures += 1;
      nextApiAt = Math.max(nextApiAt, performance.now() + Math.min(60000, 2000 * 2 ** Math.min(apiFailures, 5)));
      console.warn(
        "Commons error:",
        err
      );

      setStatus(
        "Commons query failed",
        false
      );
    }
  }

  function allCategoriesExhausted() {
    return searchSession
      .categoryStates
      .every(
        item =>
          item.exhausted
      );
  }

  /*
  ============================================================
  DETECT THE RAINBOW
  ============================================================
  */

  async function inspectItem(
    item,
    token
  ) {
    if (token !== runToken || state.paused || state.complete ||
        state.sourceTitles.has(item.title) || (item.sha1 && state.sourceHashes.has(item.sha1))) return;

    setStatus(
      "looking for a rainbow…",
      true
    );

    let img;
    const waitStarted = performance.now();
    const loaded = await prepareImage(item);
    prefetched.delete(item.thumburl);
    metrics.imageWaitMs += performance.now() - waitStarted;
    if (loaded.error) {
      if (token === runToken) setStatus("image failed", false);
      return;
    }
    img = loaded.img;

    if (
      token !== runToken ||
      state.paused
    ) {
      return;
    }

    state.searched += 1;
    updateHud();

    let detections;

    try {
      const started = performance.now();
      const inputCanvas = document.createElement("canvas");
      const ratio = Math.min(1, INPUT_MAX_EDGE / Math.max(img.width, img.height));
      inputCanvas.width = Math.max(1, Math.round(img.width * ratio));
      inputCanvas.height = Math.max(1, Math.round(img.height * ratio));
      // One pixel read per image: retain the standard raster path used in benchmarks.
      inputCanvas.getContext("2d").drawImage(
        img, 0, 0, inputCanvas.width, inputCanvas.height
      );
      const input = RawImage.fromCanvas(inputCanvas);
      metrics.preparationMs += performance.now() - started;
      detections = await inferSerial(input, token);
      // Detector boxes refer to input pixels; crops always use the original photo.
      detections = detections?.map(d => ({ ...d, box: {
        xmin: d.box.xmin * img.width / input.width,
        xmax: d.box.xmax * img.width / input.width,
        ymin: d.box.ymin * img.height / input.height,
        ymax: d.box.ymax * img.height / input.height
      }}));
    }
    catch (err) {
      console.warn(
        "Detection failed:",
        err
      );

      if (token === runToken && !state.complete) setStatus("detector error: " + (err.message || String(err)), false);

      return;
    }

    if (
      token !== runToken ||
      state.paused
    ) {
      return;
    }

    const best =
      chooseBestRainbowDetection(
        detections,
        img
      );

    if (!best) {

      setStatus(
        "searching for rainbows…",
        false
      );

      return;
    }

    if (
      best.score <
      ACCEPT_SCORE
    ) {
      setStatus(
        "searching for rainbows…",
        false
      );

      return;
    }

    const cropStarted = performance.now();
    const crop =
      extractDetection(
        img,
        best.box
      );

    if (!crop) {
      setStatus(
        "crop failed",
        false
      );

      return;
    }

    metrics.cropMs += performance.now() - cropStarted;
    acceptFragment(
      crop,
      best,
      item
    );

    if (!state.complete) setStatus("trying to complete the circle…", false);
  }

  function chooseBestRainbowDetection(
    detections,
    img
  ) {
    if (
      !Array.isArray(
        detections
      ) ||
      !detections.length
    ) {
      return null;
    }

    const usable =
      detections
        .filter(
          d =>
            d &&
            d.box &&
            Number.isFinite(
              d.score
            )
        )
        .filter(d => [d.box.xmin, d.box.ymin, d.box.xmax, d.box.ymax].every(Number.isFinite)
          && d.box.xmax > d.box.xmin && d.box.ymax > d.box.ymin)
        .filter(
          d =>
            /rainbow/i
              .test(
                d.label || ""
              )
        )
        .map(
          d => {
            const box =
              normalizeBox(
                d.box,
                img.width,
                img.height
              );

            const width =
              Math.max(
                1,
                box.xmax -
                box.xmin
              );

            const height =
              Math.max(
                1,
                box.ymax -
                box.ymin
              );

            const area =
              width *
              height;

            const imageArea =
              img.width *
              img.height;

            const areaRatio =
              area /
              Math.max(
                imageArea,
                1
              );

            /*
            Penalize boxes that cover nearly the whole photo.
            We want localisation, not "this whole image is rainbow".
            */
            let adjusted =
              d.score;

            if (
              areaRatio >
              0.72
            ) {
              adjusted *=
                0.55;
            }

            /*
            Very tiny detections can also be suspicious.
            */
            if (
              areaRatio <
              0.002
            ) {
              adjusted *=
                0.55;
            }

            /*
            Rainbows are often somewhat elongated.
            Small bonus only — not a requirement.
            */
            const aspect =
              Math.max(
                width / height,
                height / width
              );

            if (
              aspect > 1.35
            ) {
              adjusted *=
                1.08;
            }

            return {
              ...d,
              score:
                clamp(
                  adjusted,
                  0,
                  1
                ),
              box
            };
          }
        )
        .sort(
          (a, b) =>
            b.score -
            a.score
        );

    return (
      usable[0] ||
      null
    );
  }

  /*
  Transformers.js may return pixel coordinates.
  This function simply clamps them safely.
  */
  function normalizeBox(
    box,
    width,
    height
  ) {
    return {
      xmin:
        clamp(
          box.xmin,
          0,
          width
        ),

      ymin:
        clamp(
          box.ymin,
          0,
          height
        ),

      xmax:
        clamp(
          box.xmax,
          0,
          width
        ),

      ymax:
        clamp(
          box.ymax,
          0,
          height
        )
    };
  }

  /*
  ============================================================
  CROP REAL RAINBOW
  ============================================================

  No bending.
  No stripe manipulation.

  We simply crop the real model-detected region,
  leaving some photographic context around it.
  ============================================================
  */

  function extractDetection(
    img,
    box
  ) {
    const boxW =
      Math.max(
        1,
        box.xmax -
        box.xmin
      );

    const boxH =
      Math.max(
        1,
        box.ymax -
        box.ymin
      );

    const padX =
      boxW *
      BOX_PADDING_X;

    const padY =
      boxH *
      BOX_PADDING_Y;

    const sx =
      clamp(
        box.xmin -
        padX,
        0,
        img.width
      );

    const sy =
      clamp(
        box.ymin -
        padY,
        0,
        img.height
      );

    const ex =
      clamp(
        box.xmax +
        padX,
        0,
        img.width
      );

    const ey =
      clamp(
        box.ymax +
        padY,
        0,
        img.height
      );

    const sw =
      ex - sx;

    const sh =
      ey - sy;

    if (
      sw < 10 ||
      sh < 10
    ) {
      return null;
    }

    const OUT_W = 520;

    const OUT_H =
      clamp(
        Math.round(
          OUT_W *
          sh /
          sw
        ),
        120,
        480
      );

    workCanvas.width =
      OUT_W;

    workCanvas.height =
      OUT_H;

    workCtx.clearRect(
      0,
      0,
      OUT_W,
      OUT_H
    );

    workCtx.drawImage(
      img,

      sx,
      sy,
      sw,
      sh,

      0,
      0,
      OUT_W,
      OUT_H
    );

    /*
    CLEAN EDGES

    No artificial feathering, vignette or alpha mask.
    The crop remains exactly as it appears in the source image.
    */

    const out =
      document.createElement(
        "canvas"
      );

    out.width =
      OUT_W;

    out.height =
      OUT_H;

    out
      .getContext("2d")
      .drawImage(
        workCanvas,
        0,
        0
      );

    return out;
  }

  /*
  ============================================================
  PLACE FRAGMENT
  ============================================================
  */

  function acceptFragment(
    fragmentCanvas,
    detection,
    item
  ) {
    if (state.sourceTitles.has(item.title) || (item.sha1 && state.sourceHashes.has(item.sha1))) return;
    const placementStarted = performance.now();
    state.sourceTitles.add(item.title);
    if (item.sha1) state.sourceHashes.add(item.sha1);
    const angle =
      choosePlacementAngle();

    state.fragments.push({
      canvas:
        fragmentCanvas,

      title:
        item.title,

      detectionLabel:
        detection.label,

      detectionScore:
        detection.score,

      angle,

      /*
      Back to the rougher visual behaviour.
      */
      scale:
        randomRange(
          0.34,
          0.96
        ),

      widthScale:
        randomRange(
          0.82,
          1.24
        ),

      radialOffset:
        randomRange(
          -0.16,
          0.16
        ),

      rotationError:
        degToRad(
          randomRange(
            -30,
            30
          )
        ),

      flipX:
        Math.random() <
        0.42,

      flipY:
        Math.random() <
        0.05,

      alpha:
        Math.random() < 0.14
          ? randomRange(
              0.98,
              1
            )
          : randomRange(
              0.86,
              0.94
            )
    });

    const fragment = state.fragments[state.fragments.length - 1];
    // Evaluate positions, retaining all the random scale/flip/rotation properties.
    if (Math.random() >= 0.15) {
      let bestAngle = fragment.angle;
      let bestGain = -1;
      const gap = centreOfLargestGap(state.coveredSectors);
      for (let step = 0; step < 72; step += 1) {
        const sector = (gap + step) % 72;
        if (state.coveredSectors[sector]) continue;
        fragment.angle = (sector + 0.5) / 72 * Math.PI * 2 + degToRad(randomRange(-3, 3));
        const gain = fragmentCoverage(fragment).filter(i => !state.coveredSectors[i]).length;
        if (gain > bestGain) { bestGain = gain; bestAngle = fragment.angle; }
      }
      fragment.angle = bestAngle;
    }
    state.accepted += 1;

    /*
    Keep autonomous replacement alive.
    */
    if (
      state.fragments.length >
      46
    ) {
      // Remove the least useful early fragment, preserving uniquely covered gaps.
      const counts = new Array(72).fill(0);
      for (const fragment of state.fragments) {
        for (const sector of fragmentCoverage(fragment)) counts[sector] += 1;
      }
      let index = 0;
      let least = Infinity;
      for (let i = 0; i < 12; i += 1) {
        const unique = fragmentCoverage(state.fragments[i]).filter(j => counts[j] === 1).length;
        if (unique < least) { least = unique; index = i; }
      }

      state.fragments.splice(
        index,
        1
      );
    }

    recomputeCoverage();
    metrics.accepted += 1;
    const now = performance.now();
    if (metrics.lastAcceptedAt !== null) {
      metrics.acceptanceIntervals += 1;
      metrics.acceptanceIntervalMs += now - metrics.lastAcceptedAt;
    }
    metrics.lastAcceptedAt = now;
    drawAll();
    updateHud();

    checkCompletion();
    metrics.placementMs += performance.now() - placementStarted;
  }

  function choosePlacementAngle() {
    const sectors =
      state.coveredSectors.length;

    const empty = [];

    for (let i = 0; i < sectors; i += 1) {
      if (!state.coveredSectors[i]) {
        empty.push(i);
      }
    }

    /*
    Usually aim directly at an uncovered sector.

    But 15% of the time the system makes a bad decision and
    places the new rainbow somewhere else. This preserves the
    rough overlapping behaviour without allowing it to ignore
    gaps most of the time.
    */
    let sector;

    if (
      empty.length &&
      Math.random() >= 0.15
    ) {
      /*
      Prefer the centre of the largest remaining gap.
      */
      sector =
        centreOfLargestGap(
          state.coveredSectors
        );
    }
    else {
      sector =
        Math.floor(
          Math.random() *
          sectors
        );
    }

    const base =
      (
        sector +
        0.5
      ) /
      sectors *
      Math.PI *
      2;

    return (
      base +
      degToRad(
        randomRange(
          -7,
          7
        )
      )
    );
  }

  function centreOfLargestGap(
    covered
  ) {
    const n =
      covered.length;

    let bestStart = 0;
    let bestLength = 0;

    /*
    Search two revolutions so gaps crossing 0° are handled.
    */
    let currentStart = 0;
    let currentLength = 0;

    for (
      let i = 0;
      i < n * 2;
      i += 1
    ) {
      const index =
        i % n;

      if (!covered[index]) {
        if (currentLength === 0) {
          currentStart = i;
        }

        currentLength += 1;

        if (
          currentLength > bestLength &&
          currentLength <= n
        ) {
          bestLength =
            currentLength;

          bestStart =
            currentStart;
        }
      }
      else {
        currentLength = 0;
      }
    }

    if (bestLength === 0) {
      return Math.floor(
        Math.random() *
        n
      );
    }

    return (
      Math.floor(
        bestStart +
        bestLength / 2
      ) %
      n
    );
  }

  // Coverage is the transformed photographic rectangle intersecting the ring.
  // This is a composition proxy, not a claim that every pixel contains rainbow.
  function fragmentCoverage(fragment) {
    const size = canvas.width;
    const radius = size * 0.27;
    const placement = getSafeFragmentPosition(fragment, size / 2, size / 2, radius, size, size);
    const rotation = fragment.angle + Math.PI / 2 + fragment.rotationError;
    const cos = Math.cos(rotation), sin = Math.sin(rotation);
    const result = [];
    for (let i = 0; i < 72; i += 1) {
      // Sample both ends and the centre to avoid counting a tiny corner as covered.
      const covered = [0.1, 0.5, 0.9].every(offset => {
        const angle = (i + offset) / 72 * Math.PI * 2;
        const delta = Math.abs(normalizeAngle(angle - fragment.angle + Math.PI) - Math.PI);
        if (delta > degToRad(21)) return false;
        const dx = size / 2 + Math.cos(angle) * radius - placement.x;
        const dy = size / 2 + Math.sin(angle) * radius - placement.y;
        return Math.abs(dx * cos + dy * sin) <= placement.drawW / 2 &&
          Math.abs(-dx * sin + dy * cos) <= placement.drawH / 2;
      });
      if (covered) result.push(i);
    }
    return result;
  }

  function markFragmentCoverage(fragment) {
    for (const i of fragmentCoverage(fragment)) state.coveredSectors[i] = true;
  }

  function recomputeCoverage() {
    state.coveredSectors.fill(false);
    for (const fragment of state.fragments) markFragmentCoverage(fragment);
  }

  function normalizeAngle(
    angle
  ) {
    let value =
      angle %
      (
        Math.PI *
        2
      );

    if (value < 0) {
      value +=
        Math.PI *
        2;
    }

    return value;
  }

  function checkCompletion() {
    if (
      state.complete
    ) {
      return true;
    }

    const complete =
      state.coveredSectors
        .every(Boolean);

    if (!complete) {
      return false;
    }

    state.complete = true;
    state.paused = true;

    setStatus(
      "complete",
      false
    );

    saveImageBtn.classList.add(
      "is-visible"
    );

    newRainbowBtn.classList.add(
      "is-visible"
    );

    /*
    Incrementing runToken stops the autonomous search loop.
    No more Commons images are requested and no more model
    detections are run.
    */
    runToken += 1;

    return true;
  }

  /*
  ============================================================
  LOOP
  ============================================================
  */

  async function run() {
    const token =
      ++runToken;

    while (
      token === runToken
    ) {
      if (
        state.complete
      ) {
        return;
      }

      if (
        state.paused
      ) {
        await sleep(250);
        continue;
      }

      if (
        searchSession.queue.length ===
        0
      ) {
        await refillQueue();
      }

      if (
        token !== runToken
      ) {
        return;
      }

      const item =
        searchSession.queue.shift();

      if (!item) {
        if (allCategoriesExhausted()) return;
        await sleep(800);
        continue;
      }

      prefetchNext();
      await inspectItem(
        item,
        token
      );

      // Yield for painting/input without adding a fixed pause to every search.
      await sleep(0);
    }
  }

  /*
  ============================================================
  SAVE IMAGE — 3000 × 3000 PNG
  ============================================================

  Re-renders the final composition at 3000 × 3000 px
  with a solid black background.
  ============================================================
  */

  function renderCompositionToCanvas(
    targetCanvas
  ) {
    const targetCtx =
      targetCanvas.getContext(
        "2d"
      );

    const size =
      targetCanvas.width;

    const cx =
      size / 2;

    const cy =
      size / 2;

    const targetR =
      size * 0.27;

    targetCtx.save();

    targetCtx.globalAlpha = 1;

    targetCtx.fillStyle =
      "#020202";

    targetCtx.fillRect(
      0,
      0,
      size,
      size
    );

    targetCtx.restore();

    for (
      const fragment
      of state.fragments
    ) {
      const img =
        fragment.canvas;

      const angle =
        fragment.angle;

      const { x, y, drawW, drawH } = getSafeFragmentPosition(
        fragment, cx, cy, targetR, size, size
      );
      const rotation = angle + Math.PI / 2 + fragment.rotationError;

      targetCtx.save();

      targetCtx.translate(
        x,
        y
      );

      targetCtx.rotate(
        rotation
      );

      targetCtx.scale(
        fragment.flipX
          ? -1
          : 1,

        fragment.flipY
          ? -1
          : 1
      );

      targetCtx.globalAlpha =
        fragment.alpha;

      targetCtx.drawImage(
        img,

        -drawW / 2,
        -drawH / 2,

        drawW,
        drawH
      );

      targetCtx.restore();
    }
  }

  function saveHighResolutionImage() {
    const EXPORT_SIZE =
      3000;

    const exportCanvas =
      document.createElement(
        "canvas"
      );

    exportCanvas.width =
      EXPORT_SIZE;

    exportCanvas.height =
      EXPORT_SIZE;

    renderCompositionToCanvas(
      exportCanvas
    );

    exportCanvas.toBlob(
      blob => {
        if (!blob) {
          return;
        }

        const url =
          URL.createObjectURL(
            blob
          );

        const now =
          new Date();

        const pad =
          value =>
            String(value)
              .padStart(
                2,
                "0"
              );

        const filename =
          `rainbow-${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}-3000x3000.png`;

        const link =
          document.createElement(
            "a"
          );

        link.href =
          url;

        link.download =
          filename;

        document.body.appendChild(
          link
        );

        link.click();

        link.remove();

        setTimeout(
          () =>
            URL.revokeObjectURL(
              url
            ),
          1000
        );
      },
      "image/png"
    );
  }

  saveImageBtn.addEventListener(
    "click",
    () => {
      if (!state.complete) {
        return;
      }

      saveHighResolutionImage();
    }
  );

  /*
  ============================================================
  NEW RAINBOW
  ============================================================

  The button only appears after completion.

  It clears the finished circle, but the in-memory Commons
  session continues where it left off.
  ============================================================
  */

  newRainbowBtn.addEventListener(
    "click",
    () => {
      if (!state.complete) return;
      runToken += 1;
      metrics.lastAcceptedAt = null;
      state =
        freshCircleState();

      saveImageBtn.classList.remove(
        "is-visible"
      );

      newRainbowBtn.classList.remove(
        "is-visible"
      );

      updateHud();
      drawAll();

      setStatus(
        "searching for rainbows…",
        false
      );

      run().catch(err => setStatus("artwork error: " + (err.message || String(err)), false));
    }
  );

  window.addEventListener("resize", resizeCanvas);
  // The footer can wrap or grow when controls/errors appear.
  if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(canvas);
  window.visualViewport?.addEventListener("resize", resizeCanvas);

  /*
  ============================================================
  HELPERS
  ============================================================
  */

  function withTimeout(promise, ms, message, onLateResult) {
    return new Promise((resolve, reject) => {
      let expired = false;
      const timer = setTimeout(() => {
        expired = true;
        reject(new Error(message));
      }, ms);
      promise.then(value => {
        clearTimeout(timer);
        if (expired) onLateResult?.(value);
        else resolve(value);
      }, error => { clearTimeout(timer); reject(error); });
    });
  }

  function loadImage(
    url
  ) {
    return new Promise(
      (
        resolve,
        reject
      ) => {
        const img =
          new Image();

        img.crossOrigin =
          "anonymous";

        img.decoding =
          "async";

        const timeout = setTimeout(() => {
          img.onload = img.onerror = null;
          img.src = "";
          reject(new Error("Image load timed out"));
        }, 20000);
        img.onload = async () => {
          try {
            const decodeStarted = performance.now();
            await img.decode();
            metrics.imageDecodeMs += performance.now() - decodeStarted;
            clearTimeout(timeout);
            resolve(img);
          } catch (error) { clearTimeout(timeout); reject(error); }
        };

        img.onerror = error => { clearTimeout(timeout); reject(error); };

        img.src =
          url;
      }
    );
  }

  function updateHud() {
    /*
    V11 deliberately exposes no counters or technical UI.
    */
  }

  function setStatus(
    text,
    loading
  ) {
    statusEl.textContent =
      text;
  }

  function clamp(
    value,
    min,
    max
  ) {
    return Math.max(
      min,
      Math.min(
        max,
        value
      )
    );
  }

  function degToRad(
    deg
  ) {
    return (
      deg *
      Math.PI /
      180
    );
  }

  function randomRange(
    min,
    max
  ) {
    return (
      min +
      Math.random() *
      (
        max -
        min
      )
    );
  }

  function sleep(
    ms
  ) {
    return new Promise(
      resolve =>
        setTimeout(
          resolve,
          ms
        )
    );
  }

  function lightShuffle(
    array
  ) {
    /*
    Partial shuffle:
    retain some filename preference while avoiding
    exactly the same order every run.
    */
    for (
      let i =
        array.length - 1;
      i > 0;
      i -= 1
    ) {
      if (
        Math.random() <
        0.45
      ) {
        const j =
          Math.floor(
            Math.random() *
            (
              i + 1
            )
          );

        [
          array[i],
          array[j]
        ] = [
          array[j],
          array[i]
        ];
      }
    }
  }

  /*
  ============================================================
  START
  ============================================================
  */

  updateHud();
  resizeCanvas();
  loadDetector();

})();
</script>
